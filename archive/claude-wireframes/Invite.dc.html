<h1 style="margin: 0; font-size: 30px">Invite a new hire</h1>
<p style="margin: 0; font-size: 16px">Send a link so your new hire can fill out their part online.</p>
<div style="display: flex; gap: 32px">
<div style="border: 1px solid #000000; padding: 16px; width: 620px; display: flex; flex-direction: column; gap: 16px; font-size: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nm">New hire's full name</label><input id="nm" type="text" value="[NAME]" style="font-size: 16px; width: 360px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="em">Their email</label><input id="em" type="email" value="[EMAIL]" style="font-size: 16px; width: 360px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="sd">First day of work</label><input id="sd" type="text" value="09/21/2026" style="font-size: 16px; width: 160px"></div>
<label style="display: flex; gap: 8px; align-items: flex-start"><input type="checkbox" checked> <span>They have accepted the job offer. <i>(Required. In California you can't run E-Verify on someone before an offer.)</i></span></label>
<div><a href="Status.dc.html" style="display: inline-block; border: 2px solid #000000; padding: 10px 16px; color: #000000; text-decoration: none; font-size: 16px; font-weight: bold; background: #ffffff">Create invite link</a></div>
</div>
<div style="border: 1px solid #000000; padding: 16px; width: 460px; height: fit-content; display: flex; flex-direction: column; gap: 12px; font-size: 16px">
<b>Invite link (after you click create)</b>
<div style="border: 1px solid #000000; padding: 10px; font-family: monospace; font-size: 15px">[app-url]/join/8F3K-2Q7M</div>
<div style="display: flex; gap: 10px"><button type="button" style="font-size: 15px; padding: 6px 12px">Copy link</button><button type="button" style="font-size: 15px; padding: 6px 12px">Email it to them</button></div>
<span style="font-size: 14px">Link works once and expires in 7 days.</span>
</div>
